<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110d">
  <title>Published - WalkFinder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" data-back="saved.html" aria-label="Go back">←</button>
      <h1>Published</h1>
      <button class="icon-button" type="button" data-page="profile.html" aria-label="Open profile">👤</button>
    </header>

    <main class="page-content">
      <section class="published-card">
        <div class="success-badge">✓ Published</div>
        <h2 id="publishedName">Your walk</h2>
        <p id="publishedDetail">Your route is now ready in your saved collection.</p>

        <div class="link-stack">
          <button class="button-primary full-width" type="button" data-page="saved.html">View Saved</button>
          <button class="button-secondary full-width" type="button" data-page="index.html">Back to Discover</button>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" type="button" data-page="index.html">
        <span class="nav-icon">⌂</span>
        <span>Discover</span>
      </button>
      <button class="nav-item" type="button" data-page="record-walk.html">
        <span class="nav-icon">◉</span>
        <span>Record</span>
      </button>
      <button class="nav-item primary-nav" type="button" data-page="add-path.html">
        <span class="nav-icon">＋</span>
        <span>Add Path</span>
      </button>
      <button class="nav-item" type="button" data-page="saved.html">
        <span class="nav-icon">★</span>
        <span>Saved</span>
      </button>
      <button class="nav-item" type="button" data-page="profile.html">
        <span class="nav-icon">☰</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
