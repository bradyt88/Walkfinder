<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110d">
  <title>WalkFinder</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="walkfinder-hero.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">WALK<span>FINDER</span></div>
      <div class="topbar-actions">
        <button class="icon-button ghost" type="button" data-page="saved.html" aria-label="Saved walks">★</button>
        <button class="icon-button" type="button" data-page="profile.html" aria-label="Open profile">👤</button>
      </div>
    </header>

    <main class="page-content">
      <label class="search-bar" aria-label="Search walks">
        <span class="search-icon">⌕</span>
        <input id="searchInput" type="text" placeholder="Search walks, places or paths...">
      </label>

      <section class="hero-panel walkfinder-hero" aria-label="Discover hero">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <div class="eyebrow">Discover somewhere new</div>
          <h1>Find paths<br>less travelled.</h1>
          <p>Discover walks shared by people who know the area.</p>
        </div>
      </section>

      <section class="section-block">
        <div class="section-header">
          <h2>Explore</h2>
          <button id="clearFilters" class="text-button" type="button">Clear</button>
        </div>

        <div class="category-list">
          <button class="category-chip active" type="button" data-category="all">Nearby</button>
          <button class="category-chip" type="button" data-category="hills">Hills</button>
          <button class="category-chip" type="button" data-category="woodland">Woodland</button>
          <button class="category-chip" type="button" data-category="water">Water</button>
          <button class="category-chip" type="button" data-category="adventure">Adventure</button>
        </div>

        <div class="section-header">
          <h2>Nearby walks</h2>
        </div>

        <div id="walkList" class="walk-list" aria-live="polite"></div>

        <div id="emptyState" class="empty-state" hidden>No walks found.</div>

        <div class="map-section">
          <div class="section-header">
            <h2>Explore the map</h2>
          </div>

          <div id="discoverMap" class="map-preview leaflet-map" aria-label="Interactive WalkFinder map">
            <div class="map-label">🗺️ WalkFinder map</div>
            <button class="map-cta" type="button" data-page="add-path.html">Open map</button>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" type="button" data-page="index.html">
        <span class="nav-icon">⌂</span>
        <span>Discover</span>
      </button>
      <button class="nav-item" type="button" data-page="record-walk.html">
        <span class="nav-icon">◉</span>
        <span>Record</span>
      </button>
      <button class="nav-item primary-nav" type="button" data-page="add-path.html">
        <span class="nav-icon">＋</span>
        <span>Add Path</span>
      </button>
      <button class="nav-item" type="button" data-page="saved.html">
        <span class="nav-icon">★</span>
        <span>Saved</span>
      </button>
      <button class="nav-item" type="button" data-page="profile.html">
        <span class="nav-icon">☰</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
