<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071412">
<title>Route Details - WalkFinder</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#071412;
--panel:#0d211d;
--panel-light:#132a25;
--border:rgba(255,255,255,.09);
--text:#f4f7f5;
--muted:#9eaaa6;
--green:#63e58b;
--dark:#062010;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#020807;
color:var(--text);
min-height:100vh
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

.app{
max-width:520px;
min-height:100vh;
margin:auto;
background:var(--bg);
padding-bottom:30px
}

.header{
height:70px;
padding:14px 18px;
display:flex;
align-items:center;
gap:15px;
border-bottom:1px solid var(--border)
}

.back{
width:42px;
height:42px;
border-radius:50%;
border:1px solid var(--border);
background:var(--panel);
color:white;
font-size:22px
}

.header h1{font-size:19px}

.form{
padding:22px 20px
}

.field{
margin-bottom:18px
}

label{
display:block;
font-size:12px;
font-weight:bold;
margin-bottom:8px
}

input,textarea,select{
width:100%;
border:1px solid var(--border);
background:var(--panel);
color:white;
border-radius:14px;
padding:14px;
outline:none
}

input:focus,
textarea:focus,
select:focus{
border-color:var(--green)
}

textarea{
min-height:110px;
resize:vertical
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.tags{
display:flex;
flex-wrap:wrap;
gap:8px
}

.tag{
padding:10px 13px;
border-radius:20px;
border:1px solid var(--border);
background:var(--panel);
color:#cbd5d0
}

.tag.active{
background:var(--green);
color:var(--dark);
font-weight:bold
}

.publish{
width:100%;
height:56px;
border:none;
border-radius:16px;
background:var(--green);
color:var(--dark);
font-weight:800;
font-size:15px;
margin-top:5px
}

.note{
margin-top:15px;
padding:13px;
border-radius:14px;
background:rgba(99,229,139,.06);
border:1px solid rgba(99,229,139,.14);
color:var(--muted);
font-size:10px;
line-height:1.5
}

@media(min-width:521px){
body{padding:25px 0}
.app{
border-radius:28px;
box-shadow:0 20px 80px rgba(0,0,0,.45)
}
}
</style>
</head>

<body>

<main class="app">

<header class="header">

<button class="back" id="back">‹</button>

<h1>Route Details</h1>

</header>

<section class="form">

<div class="field">

<label for="name">
WALK NAME
</label>

<input
id="name"
type="text"
placeholder="Give your walk a name..."
>

</div>

<div class="field">

<label for="description">
DESCRIPTION
</label>

<textarea
id="description"
placeholder="Tell other walkers what makes this walk worth doing..."
></textarea>

</div>

<div class="field row">

<div>

<label for="difficulty">
DIFFICULTY
</label>

<select id="difficulty">

<option>Easy</option>
<option selected>Moderate</option>
<option>Hard</option>
<option>Expert</option>

</select>

</div>

<div>

<label for="type">
ROUTE TYPE
</label>

<select id="type">

<option>Loop</option>
<option>Out & Back</option>
<option>Point to Point</option>

</select>

</div>

</div>

<div class="field">

<label>
WHAT WILL WALKERS FIND?
</label>

<div class="tags">

<button class="tag">🌲 Woodland</button>
<button class="tag">🌊 Water</button>
<button class="tag">👀 Views</button>
<button class="tag">⛰️ Hills</button>
<button class="tag">📸 Photography</button>
<button class="tag">🐕 Dog Friendly</button>
<button class="tag">👨‍👩‍👧 Family</button>
<button class="tag">🔥 Adventure</button>

</div>

</div>

<div class="field">

<label for="advice">
WALKER ADVICE
</label>

<textarea
id="advice"
placeholder="Anything people should know? Mud, parking, steep sections, gates, footwear..."
></textarea>

</div>

<div class="field row">

<div>

<label for="status">
ROUTE STATUS
</label>

<select id="status">

<option>Established Trail</option>
<option selected>Community Discovery</option>
<option>Informal / Off Trail</option>

</select>

</div>

<div>

<label for="visibility">
VISIBILITY
</label>

<select id="visibility">

<option>Public</option>
<option>Friends</option>
<option>Private</option>

</select>

</div>

</div>

<button class="publish" id="publish">
PUBLISH WALK
</button>

<div class="note">

⚠️ Only publish routes where you believe access is appropriate.
WalkFinder does not verify land access or public rights of way.

</div>

</section>

</main>

<script>

const tags=document.querySelectorAll(".tag");

tags.forEach(tag=>{

tag.addEventListener("click",()=>{

tag.classList.toggle("active");

});

});

document.getElementById("back").addEventListener(
"click",
()=>{
window.location.href="draw-route.html";
}
);

document.getElementById("publish").addEventListener(
"click",
()=>{

const name=document.getElementById("name").value.trim();

if(!name){

alert("Give your walk a name first.");

return;
}

alert(
"Walk saved! Publishing will be connected to the WalkFinder community in a later stage."
);

}
);

</script>

</body>
</html>
