<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110d">
  <title>Route Details - WalkFinder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" data-back="history" aria-label="Go back">←</button>
      <h1>Route Details</h1>
      <button class="icon-button" type="button" data-page="profile.html" aria-label="Open profile">👤</button>
    </header>

    <main class="page-content">
      <section class="detail-cover" id="detailCover">
        <button class="cover-button" type="button">Change Cover Photo</button>
      </section>

      <section class="detail-panel">
        <div id="routeSummary" class="summary-box"></div>

        <div class="field">
          <label for="name">Walk name</label>
          <input id="name" type="text" placeholder="Give your walk a name...">
        </div>

        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" placeholder="Tell other walkers what makes this walk worth doing..."></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty">
              <option>Easy</option>
              <option selected>Moderate</option>
              <option>Hard</option>
              <option>Expert</option>
            </select>
          </div>

          <div class="field">
            <label for="routeType">Route type</label>
            <select id="routeType">
              <option>Loop</option>
              <option>Out &amp; Back</option>
              <option>Point to Point</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>What will walkers find?</label>
          <div class="tag-grid">
            <button class="tag-button" type="button" data-tag="Woodland">🌲 Woodland</button>
            <button class="tag-button" type="button" data-tag="Water">🌊 Water</button>
            <button class="tag-button" type="button" data-tag="Views">👀 Views</button>
            <button class="tag-button" type="button" data-tag="Hills">⛰️ Hills</button>
            <button class="tag-button" type="button" data-tag="Photography">📸 Photography</button>
            <button class="tag-button" type="button" data-tag="Dog Friendly">🐕 Dog Friendly</button>
            <button class="tag-button" type="button" data-tag="Family">👨‍👩‍👧 Family</button>
            <button class="tag-button" type="button" data-tag="Adventure">🔥 Adventure</button>
          </div>
        </div>

        <div class="field">
          <label for="advice">Walker advice</label>
          <textarea id="advice" placeholder="Anything people should know? Mud, parking, steep sections, gates, footwear..."></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="routeStatus">Route status</label>
            <select id="routeStatus">
              <option>Established Trail</option>
              <option selected>Community Discovery</option>
              <option>Informal / Off Trail</option>
            </select>
          </div>

          <div class="field">
            <label for="visibility">Visibility</label>
            <select id="visibility">
              <option>Public</option>
              <option>Friends</option>
              <option>Private</option>
            </select>
          </div>
        </div>

        <button id="nextToPhotos" class="button-primary full-width" type="button">Next: Add Photos</button>
        <div id="formMessage" class="inline-message" hidden></div>

        <div class="note-box">
          WalkFinder does not verify access rights or public rights of way. Please only publish routes you know are appropriate to share.
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" type="button" data-page="index.html">
        <span class="nav-icon">⌂</span>
        <span>Discover</span>
      </button>
      <button class="nav-item" type="button" data-page="record-walk.html">
        <span class="nav-icon">◉</span>
        <span>Record</span>
      </button>
      <button class="nav-item primary-nav" type="button" data-page="add-path.html">
        <span class="nav-icon">＋</span>
        <span>Add Path</span>
      </button>
      <button class="nav-item" type="button" data-page="saved.html">
        <span class="nav-icon">★</span>
        <span>Saved</span>
      </button>
      <button class="nav-item" type="button" data-page="profile.html">
        <span class="nav-icon">☰</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
