<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110d">
  <title>Add a Path - WalkFinder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" data-back="index.html" aria-label="Go back">←</button>
      <h1>Add a Path</h1>
      <button class="icon-button" type="button" data-page="profile.html" aria-label="Open profile">👤</button>
    </header>

    <main class="page-content">
      <section class="intro-block">
        <div class="eyebrow">Start a walk</div>
        <h2>How do you want to add your path?</h2>
        <p>Record somewhere you’ve walked, or create a route you want to plan ahead.</p>
      </section>

      <button class="choice-card" type="button" data-page="record-walk.html">
        <div class="choice-icon icon-record"></div>
        <div class="choice-copy">
          <h3>Record a Walk</h3>
          <p>Track your walk as you go and turn it into a route you can finish and publish.</p>
        </div>
        <div class="choice-arrow">›</div>
      </button>

      <div class="divider">or</div>

      <button class="choice-card" type="button" data-page="draw-route.html">
        <div class="choice-icon icon-draw"></div>
        <div class="choice-copy">
          <h3>Draw a Route</h3>
          <p>Plan a route by placing points on the map and turn it into a discoverable walk.</p>
        </div>
        <div class="choice-arrow">›</div>
      </button>

      <section class="tip-box">
        <div class="tip-title">WalkFinder tip</div>
        <p>You can add photos, note trail conditions and tell other walkers about parking, gates and navigation advice.</p>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" type="button" data-page="index.html">
        <span class="nav-icon">⌂</span>
        <span>Discover</span>
      </button>
      <button class="nav-item" type="button" data-page="record-walk.html">
        <span class="nav-icon">◉</span>
        <span>Record</span>
      </button>
      <button class="nav-item primary-nav active" type="button" data-page="add-path.html">
        <span class="nav-icon">＋</span>
        <span>Add Path</span>
      </button>
      <button class="nav-item" type="button" data-page="saved.html">
        <span class="nav-icon">★</span>
        <span>Saved</span>
      </button>
      <button class="nav-item" type="button" data-page="profile.html">
        <span class="nav-icon">☰</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
