<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110d">
  <title>Record Walk - WalkFinder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" data-back="add-path.html" aria-label="Go back">←</button>
      <div class="header-copy">
        <h1>Record Walk</h1>
        <div id="statusPill" class="status-pill"><span class="status-dot"></span> Ready to start</div>
      </div>
      <button class="icon-button" type="button" data-page="profile.html" aria-label="Open profile">👤</button>
    </header>

    <main class="page-content">
      <section class="map-hero record-map" aria-label="Recording preview map">
        <div class="map-label">🗺️ Route preview</div>
        <div class="map-tag">GPS ready</div>
        <div id="recordMapContainer" class="leaflet-map map-preview-large" aria-label="Interactive recording map"></div>
      </section>

      <section class="stats-grid" aria-label="Walk stats">
        <div class="stat-card">
          <div id="distance" class="stat-value">0.00</div>
          <div class="stat-label">Miles</div>
        </div>
        <div class="stat-card">
          <div id="timer" class="stat-value">00:00</div>
          <div class="stat-label">Time</div>
        </div>
        <div class="stat-card">
          <div id="elevation" class="stat-value">0</div>
          <div class="stat-label">Elevation ft</div>
        </div>
      </section>

      <section class="record-panel">
        <p id="instruction" class="instruction">When you’re ready, start your walk and WalkFinder will track your route.</p>

        <button id="startButton" class="button-primary full-width" type="button">▶ START WALK</button>

        <div id="secondaryActions" class="secondary-actions">
          <button id="pauseButton" class="button-secondary" type="button">⏸ Pause</button>
          <button id="finishButton" class="button-accent" type="button">✓ Finish</button>
        </div>

        <div class="button-row compact">
          <button class="button-secondary" type="button" data-page="photos.html">＋ Add Photo</button>
        </div>

        <div class="safety-box">
          <div class="safety-icon">⚠️</div>
          <p><strong>Stay safe.</strong> Keep your phone secure and remain aware of your surroundings. Follow local paths and access guidance.</p>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" type="button" data-page="index.html">
        <span class="nav-icon">⌂</span>
        <span>Discover</span>
      </button>
      <button class="nav-item active" type="button" data-page="record-walk.html">
        <span class="nav-icon">◉</span>
        <span>Record</span>
      </button>
      <button class="nav-item primary-nav" type="button" data-page="add-path.html">
        <span class="nav-icon">＋</span>
        <span>Add Path</span>
      </button>
      <button class="nav-item" type="button" data-page="saved.html">
        <span class="nav-icon">★</span>
        <span>Saved</span>
      </button>
      <button class="nav-item" type="button" data-page="profile.html">
        <span class="nav-icon">☰</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
