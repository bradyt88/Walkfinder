<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07110d">
  <title>Draw Route - WalkFinder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" type="button" data-back="add-path.html" aria-label="Go back">←</button>
      <h1>Draw a Route</h1>
      <button class="icon-button" type="button" data-page="profile.html" aria-label="Open profile">👤</button>
    </header>

    <main class="page-content">
      <section id="drawMap" class="map-hero draw-map" aria-label="Draw route map">
        <div class="map-header-inline">
          <div class="map-label">✏️ Tap the map to add points</div>
          <div id="pointCount" class="map-label">0 points</div>
        </div>

        <div id="drawMapContainer" class="leaflet-map map-preview-large" aria-label="Interactive draw route map"></div>
        <div id="mapMessage" class="inline-message" hidden></div>

        <div class="map-hint">Tap points on the map to create your walking route</div>
      </section>

      <section class="form-panel">
        <div class="stats-grid two-up">
          <div class="stat-card">
            <div id="distance" class="stat-value">0.00</div>
            <div class="stat-label">Estimated Miles</div>
          </div>
          <div class="stat-card">
            <div id="time" class="stat-value">0 min</div>
            <div class="stat-label">Estimated Time</div>
          </div>
        </div>

        <div class="button-row compact">
          <button id="undoButton" class="button-secondary" type="button">↶ Undo</button>
          <button id="clearButton" class="button-secondary" type="button">Clear</button>
        </div>

        <button id="continueButton" class="button-primary full-width" type="button" style="margin-top: 14px;">Continue →</button>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item" type="button" data-page="index.html">
        <span class="nav-icon">⌂</span>
        <span>Discover</span>
      </button>
      <button class="nav-item" type="button" data-page="record-walk.html">
        <span class="nav-icon">◉</span>
        <span>Record</span>
      </button>
      <button class="nav-item primary-nav" type="button" data-page="add-path.html">
        <span class="nav-icon">＋</span>
        <span>Add Path</span>
      </button>
      <button class="nav-item" type="button" data-page="saved.html">
        <span class="nav-icon">★</span>
        <span>Saved</span>
      </button>
      <button class="nav-item" type="button" data-page="profile.html">
        <span class="nav-icon">☰</span>
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>
</html>
