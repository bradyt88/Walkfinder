<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#071412">
<title>Draw Route - WalkFinder</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--bg:#071412;
--panel:#0d211d;
--border:rgba(255,255,255,.09);
--text:#f4f7f5;
--muted:#9eaaa6;
--green:#63e58b;
--dark:#062010;
}

body{
font-family:Arial,Helvetica,sans-serif;
background:#020807;
color:var(--text);
min-height:100vh
}

button{font:inherit;cursor:pointer}

.app{
max-width:520px;
min-height:100vh;
margin:auto;
background:var(--bg);
overflow:hidden
}

.header{
height:70px;
padding:14px 18px;
display:flex;
align-items:center;
gap:15px;
border-bottom:1px solid var(--border)
}

.back{
width:42px;
height:42px;
border-radius:50%;
border:1px solid var(--border);
background:var(--panel);
color:white;
font-size:22px
}

.header h1{font-size:19px}

.map{
height:480px;
position:relative;
overflow:hidden;
background:
radial-gradient(circle at 25% 30%,rgba(73,126,82,.4),transparent 28%),
radial-gradient(circle at 80% 75%,rgba(52,103,68,.4),transparent 30%),
linear-gradient(135deg,#17382e,#244b3a,#112b24);
cursor:crosshair
}

.map:before{
content:"";
position:absolute;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,.12) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.12) 1px,transparent 1px);
background-size:55px 55px;
opacity:.25
}

.map-info{
position:absolute;
top:15px;
left:15px;
right:15px;
display:flex;
justify-content:space-between;
z-index:5
}

.info{
background:rgba(7,20,18,.85);
border:1px solid var(--border);
padding:9px 12px;
border-radius:12px;
font-size:10px
}

#routeSvg{
position:absolute;
inset:0;
width:100%;
height:100%;
z-index:2
}

.instructions{
position:absolute;
bottom:16px;
left:50%;
transform:translateX(-50%);
background:rgba(7,20,18,.9);
border:1px solid var(--border);
padding:11px 15px;
border-radius:13px;
font-size:11px;
white-space:nowrap;
z-index:6
}

.point{
position:absolute;
width:18px;
height:18px;
border-radius:50%;
background:var(--green);
border:4px solid white;
transform:translate(-50%,-50%);
z-index:4
}

.panel{
padding:20px
}

.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:15px
}

.stat{
background:var(--panel);
border:1px solid var(--border);
border-radius:15px;
padding:14px;
text-align:center
}

.stat strong{
display:block;
font-size:22px;
margin-bottom:4px
}

.stat span{
font-size:10px;
color:var(--muted);
text-transform:uppercase
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.action{
height:50px;
border-radius:14px;
border:1px solid var(--border);
background:var(--panel);
color:white;
font-weight:bold
}

.primary{
background:var(--green);
color:var(--dark);
border:none
}

@media(min-width:521px){
body{padding:25px 0}
.app{
border-radius:28px;
box-shadow:0 20px 80px rgba(0,0,0,.45)
}
}
</style>
</head>

<body>

<main class="app">

<header class="header">
<button class="back" id="back">‹</button>
<h1>Draw a Route</h1>
</header>

<section class="map" id="map">

<div class="map-info">
<div class="info">✏️ Tap the map to add points</div>
<div class="info" id="pointCount">0 points</div>
</div>

<svg id="routeSvg">
<polyline
id="routeLine"
fill="none"
stroke="#63e58b"
stroke-width="5"
stroke-linecap="round"
stroke-linejoin="round"
/>
</svg>

<div class="instructions">
Tap points on the map to create your walking route
</div>

</section>

<section class="panel">

<div class="stats">

<div class="stat">
<strong id="distance">0.00</strong>
<span>Estimated Miles</span>
</div>

<div class="stat">
<strong id="time">0 min</strong>
<span>Estimated Time</span>
</div>

</div>

<div class="actions">

<button class="action" id="undo">
↶ Undo
</button>

<button class="action" id="clear">
Clear
</button>

<button class="action primary" id="continue">
Continue →
</button>

</div>

</section>

</main>

<script>

const map=document.getElementById("map");
const svg=document.getElementById("routeSvg");
const line=document.getElementById("routeLine");
const distance=document.getElementById("distance");
const time=document.getElementById("time");
const pointCount=document.getElementById("pointCount");

let points=[];

function calculateDistance(){

if(points.length<2){
return 0;
}

let total=0;

for(let i=1;i<points.length;i++){

const dx=points[i].x-points[i-1].x;
const dy=points[i].y-points[i-1].y;

total+=Math.sqrt(dx*dx+dy*dy);
}

return total/80;
}

function update(){

line.setAttribute(
"points",
points.map(p=>`${p.x},${p.y}`).join(" ")
);

document.querySelectorAll(".point").forEach(
p=>p.remove()
);

points.forEach(p=>{

const marker=document.createElement("div");

marker.className="point";

marker.style.left=p.x+"px";
marker.style.top=p.y+"px";

map.appendChild(marker);

});

const miles=calculateDistance();

distance.textContent=miles.toFixed(2);

time.textContent=
Math.max(0,Math.round(miles*22))+" min";

pointCount.textContent=
points.length+
(points.length===1?" point":" points");
}

map.addEventListener("click",event=>{

if(event.target.closest(".info") ||
event.target.closest(".instructions")){
return;
}

const rect=map.getBoundingClientRect();

points.push({
x:event.clientX-rect.left,
y:event.clientY-rect.top
});

update();

});

document.getElementById("undo").addEventListener(
"click",
()=>{
points.pop();
update();
}
);

document.getElementById("clear").addEventListener(
"click",
()=>{
points=[];
update();
}
);

document.getElementById("back").addEventListener(
"click",
()=>{
window.location.href="add-path.html";
}
);

document.getElementById("continue").addEventListener(
"click",
()=>{

if(points.length<2){

alert("Add at least two points to create a route.");

return;
}

window.location.href="route-details.html";

}
);

</script>

</body>
</html>
